<div class="glass-calculator">
  <!-- Display Section -->
  <div class="calculator-display">
    <div class="display-value">{{ display }}</div>
    <div class="display-operation">
      <span *ngIf="operator && operator!==''" class="text-purple-300">{{ operator }}</span>
      <span *ngIf="operator=='=' && lastOperation" class="text-green-300">{{ lastOperation }}</span>
      <span *ngIf="!operator" class="text-white/50 text-sm">Enter value</span>
    </div>
  </div>

  <!-- Buttons Grid -->
  <div class="calculator-buttons">
    <!-- Row 1 - Function Buttons -->
    <button class="btn-function" (click)="onClearClick()">C</button>
    <button class="btn-function" (click)="onClearEntryClick()">CE</button>
    <button class="btn-operator" (click)="onOperatorClick('%')">%</button>
    <button class="btn-operator" (click)="onOperatorClick('/')">/</button>
    
    <!-- Row 2 -->
    <button class="btn-number" (click)="onDigitClick('7')">7</button>
    <button class="btn-number" (click)="onDigitClick('8')">8</button>
    <button class="btn-number" (click)="onDigitClick('9')">9</button>
    <button class="btn-operator" (click)="onOperatorClick('*')">×</button>
    
    <!-- Row 3 -->
    <button class="btn-number" (click)="onDigitClick('4')">4</button>
    <button class="btn-number" (click)="onDigitClick('5')">5</button>
    <button class="btn-number" (click)="onDigitClick('6')">6</button>
    <button class="btn-operator" (click)="onOperatorClick('-')">−</button>
    
    <!-- Row 4 -->
    <button class="btn-number" (click)="onDigitClick('1')">1</button>
    <button class="btn-number" (click)="onDigitClick('2')">2</button>
    <button class="btn-number" (click)="onDigitClick('3')">3</button>
    <button class="btn-operator" (click)="onOperatorClick('+')">+</button>
    
    <!-- Row 5 -->
    <button class="btn-number" (click)="onDigitClick('00')">00</button>
    <button class="btn-number" (click)="onDigitClick('0')">0</button>
    <button class="btn-number" (click)="onDigitClick('.')">.</button>
    <button class="btn-equals" (click)="onEqualClick()">=</button>
  </div>
</div>
