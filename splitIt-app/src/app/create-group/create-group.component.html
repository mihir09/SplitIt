<div class="bg-white p-4 rounded-lg shadow-md w-full max-w-md text-center">
  <h2 class="text-3xl font-extrabold text-blue-500 mb-6">Create New Group</h2>
  <form [formGroup]="createForm" (ngSubmit)="onCreateGroup()">
    <div class="mb-4">
      <label for="groupName" class="block text-gray-800 font-medium mb-1">Group Name:</label>
      <input type="text" id="groupName" formControlName="name" required placeholder="Trip to L.A"
        class="w-full px-3 py-2 border rounded-lg shadow-sm focus:outline-none focus:border-blue-500">
    </div>
    <div class="text-red-600" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    <button type="submit"
      class="px-4 py-2 text-white bg-blue-500 rounded-md hover:bg-blue-600 focus:outline-none focus:bg-blue-600">
      Create
    </button>
  </form>
</div>
