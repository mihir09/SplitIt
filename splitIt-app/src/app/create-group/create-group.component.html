<div class="w-full">
  <form [formGroup]="createForm" (ngSubmit)="onCreateGroup()">
    <div class="mb-6">
      <label for="groupName" class="block text-white text-lg mb-3">Group Name:</label>
      <input 
        type="text" 
        id="groupName" 
        formControlName="name" 
        required 
        placeholder="Trip to L.A"
        class="w-full px-4 py-3 bg-white/20 backdrop-blur-md border border-white/30 rounded-xl text-white placeholder-white/50 focus:outline-none focus:border-white/50 focus:bg-white/25 transition-all">
    </div>
    
    <div class="text-red-300 mb-4 text-center" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    
    <button 
      type="submit"
      class="w-full px-6 py-3 bg-white/20 backdrop-blur-md border border-white/30 rounded-xl text-white hover:bg-white/30 transition-all duration-300 hover:scale-105">
      Create Group
    </button>
  </form>
</div>
