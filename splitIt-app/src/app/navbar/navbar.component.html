<!-- Glassmorphic Navbar - Mobile Responsive -->
<div class="fixed top-0 left-0 right-0 z-50">
  <!-- Glass Effect Container -->
 <div class="backdrop-blur-xl border-b border-purple-400/30">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">

        <!-- Logo Section -->
        <div class="flex-shrink-0 flex items-center">
  <a routerLink="/" class="flex items-center space-x-2 group relative">
    
    <div class="absolute inset-0.3 bg-white/80 blur-md -z-10"></div>
    <div class="bg-white/90 backdrop-blur-sm rounded-2xl">
      <img src="assets/images/splitit-logo-navbar.png" alt="SplitIt Logo" class="h-8 md:h-10 w-auto transition-transform duration-300 group-hover:scale-105" />
    </div>
  </a>
</div>

        <!-- Desktop Navigation (hidden on mobile) -->
        <div class="hidden md:flex items-center gap-3">
          <!-- Home Button -->
          <button 
            *ngIf="authService.isAuthenticated()" 
            routerLink="/"
            class="relative px-4 py-2 text-white/90 hover:text-white transition-all duration-300 group overflow-hidden rounded-xl">
            <span class="relative z-10">Home</span>
            <div class="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition-all duration-300"></div>
            <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-purple-400 to-pink-400 group-hover:w-full transition-all duration-300"></div>
          </button>

          <!-- Username Display -->
          <div 
            *ngIf="authService.isAuthenticated() && _userDetails"
            class="relative px-4 py-2 bg-white/10 border border-white/20 rounded-xl backdrop-blur-sm">
            <span class="text-white/90 flex items-center gap-2">
              <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              {{ _userDetails.name }}
            </span>
          </div>

          <!-- Logout Button -->
          <button 
            *ngIf="authService.isAuthenticated()" 
            (click)="onLogout()"
            class="relative px-4 py-2 bg-red-500/20 hover:bg-red-500/30 border border-red-400/30 hover:border-red-400/50 text-white rounded-xl transition-all duration-300 backdrop-blur-sm hover:scale-105 shadow-lg hover:shadow-red-500/20">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
              Logout
            </span>
          </button>

          <!-- Login Button -->
          <button 
            routerLink="/login" 
            *ngIf="!authService.isAuthenticated()"
            class="relative px-4 py-2 text-white/90 hover:text-white transition-all duration-300 group overflow-hidden rounded-xl">
            <span class="relative z-10">Login</span>
            <div class="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition-all duration-300"></div>
            <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-purple-400 to-pink-400 group-hover:w-full transition-all duration-300"></div>
          </button>

          <!-- Register Button -->
          <button 
            routerLink="/register" 
            *ngIf="!authService.isAuthenticated()"
            class="relative px-4 py-2 bg-gradient-to-r from-purple-500/30 to-pink-500/30 hover:from-purple-500/40 hover:to-pink-500/40 border border-white/30 hover:border-white/50 text-white rounded-xl transition-all duration-300 backdrop-blur-sm hover:scale-105 shadow-lg hover:shadow-purple-500/20">
            <span class="flex items-center gap-2">
              Register
            </span>
          </button>
        </div>

        <!-- Mobile Menu Button (visible on mobile only) -->
        <button 
          (click)="toggleMobileMenu()"
          class="md:hidden relative p-2 bg-white/10 border border-white/20 rounded-xl backdrop-blur-sm text-white hover:bg-white/20 transition-all duration-300">
          <svg *ngIf="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <svg *ngIf="mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>

      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div 
    *ngIf="mobileMenuOpen" 
    class="md:hidden bg-white/10 backdrop-blur-xl border-b border-white/20 shadow-lg">
    <div class="px-4 py-3 space-y-2">
      
      <!-- Home Button -->
      <button 
        *ngIf="authService.isAuthenticated()" 
        routerLink="/"
        (click)="toggleMobileMenu()"
        class="w-full text-left px-4 py-3 text-white/90 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-all duration-300 flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        Home
      </button>

      <!-- Username Display -->
      <div 
        *ngIf="authService.isAuthenticated() && _userDetails"
        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl backdrop-blur-sm">
        <span class="text-white/90 flex items-center gap-3">
          <svg class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          {{ _userDetails.name }}
        </span>
      </div>

      <!-- Logout Button -->
      <button 
        *ngIf="authService.isAuthenticated()" 
        (click)="onLogout(); toggleMobileMenu()"
        class="w-full text-left px-4 py-3 bg-red-500/20 hover:bg-red-500/30 border border-red-400/30 text-white rounded-xl transition-all duration-300 flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        Logout
      </button>

      <!-- Login Button -->
      <button 
        routerLink="/login" 
        (click)="toggleMobileMenu()"
        *ngIf="!authService.isAuthenticated()"
        class="w-full text-left px-4 py-3 text-white/90 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-all duration-300 flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
        </svg>
        Login
      </button>

      <!-- Register Button -->
      <button 
        routerLink="/register" 
        (click)="toggleMobileMenu()"
        *ngIf="!authService.isAuthenticated()"
        class="w-full text-left px-4 py-3 bg-gradient-to-r from-purple-500/30 to-pink-500/30 hover:from-purple-500/40 hover:to-pink-500/40 border border-white/30 text-white rounded-xl transition-all duration-300 flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
        </svg>
        Register
      </button>

    </div>
  </div>

  <!-- Optional: Subtle bottom glow effect -->
  <div class="h-px bg-gradient-to-r from-transparent via-purple-500/20 to-transparent"></div>
</div>
