<header class="app-navbar">
  <nav class="navbar-inner" aria-label="Main navigation">
    <a routerLink="/" class="brand" aria-label="SplitIt home"><span>SplitIt<span class="brand-dot">.</span></span></a>
    <div class="desktop-links">
      <a *ngIf="authService.isAuthenticated()" routerLink="/" class="nav-link">Your groups</a>
      <span *ngIf="authService.isAuthenticated() && _userDetails" class="user-name">{{ _userDetails.name }}</span>
      <button *ngIf="authService.isAuthenticated()" (click)="onLogout()" class="nav-link sign-out">Log out</button>
      <a *ngIf="!authService.isAuthenticated()" routerLink="/login" class="nav-link">Log in</a>
      <a *ngIf="!authService.isAuthenticated()" routerLink="/register" class="nav-link nav-cta">Create account</a>
    </div>
    <button class="menu-toggle" aria-label="Toggle navigation menu" aria-controls="mobile-navigation" [attr.aria-expanded]="mobileMenuOpen" (click)="toggleMobileMenu()"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path *ngIf="!mobileMenuOpen" d="M4 7h16M4 12h16M4 17h16" stroke-width="1.8" stroke-linecap="round"/><path *ngIf="mobileMenuOpen" d="m6 6 12 12M6 18 18 6" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </nav>
  <div *ngIf="mobileMenuOpen" id="mobile-navigation" class="mobile-links">
    <span *ngIf="authService.isAuthenticated() && _userDetails" class="user-name">{{ _userDetails.name }}</span>
    <a *ngIf="authService.isAuthenticated()" routerLink="/" (click)="toggleMobileMenu()">Your groups</a>
    <button *ngIf="authService.isAuthenticated()" (click)="onLogout(); toggleMobileMenu()">Log out</button>
    <a *ngIf="!authService.isAuthenticated()" routerLink="/login" (click)="toggleMobileMenu()">Log in</a>
    <a *ngIf="!authService.isAuthenticated()" routerLink="/register" (click)="toggleMobileMenu()">Create account</a>
  </div>
</header>
