<div class="relative min-h-screen overflow-hidden pt-12">
  <!-- Professional Gradient Background -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900"></div>

  <!-- Mesh Gradient Overlays -->
  <div class="absolute inset-0 bg-gradient-to-tr from-blue-500/20 via-transparent to-purple-500/20"></div>
  <div class="absolute inset-0 bg-gradient-to-bl from-cyan-500/10 via-transparent to-pink-500/10"></div>

  <!-- Animated Professional Blobs -->
  <div
    class="absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-br from-blue-400/30 to-purple-600/30 rounded-full blur-3xl animate-pulse">
  </div>
  <div
    class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-gradient-to-tr from-cyan-400/20 to-blue-500/20 rounded-full blur-3xl animate-pulse"
    style="animation-delay: 1.5s;"></div>
  <div
    class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-gradient-to-r from-purple-400/15 to-pink-400/15 rounded-full blur-3xl animate-pulse"
    style="animation-delay: 3s;"></div>

  <!-- Content Layer -->
  <div class="relative z-10 p-4 md:p-6">

    <!-- Group Name Header - Premium Design -->
<div class="text-center mt-8 mb-8">
  <div class="inline-block relative" *ngIf="groupName">
    <!-- Glow Effect Background -->
    <div class="absolute inset-0 bg-gradient-to-r from-purple-500/30 via-pink-500/30 to-blue-500/30 rounded-2xl blur-xl"></div>
    
    <!-- Main Card -->
    <div class="relative bg-gradient-to-br from-white/15 to-white/5 backdrop-blur-xl border-2 border-white/30 rounded-2xl px-8 py-5 shadow-2xl">
      <!-- Top Accent Line -->
      <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-20 h-1 bg-gradient-to-r from-transparent via-white/60 to-transparent rounded-full"></div>
      
      <!-- Content -->
      <div class="flex flex-col items-center justify-center">
        <!-- Group Name -->
        <div class="flex flex-col items-center">
          <h1 class="text-2xl md:text-3xl text-white font-semibold bg-gradient-to-r from-white via-purple-200 to-white bg-clip-text text-transparent">
            {{groupName}}
          </h1>
        </div>
      </div>
      
      <!-- Bottom Accent Dots -->
      <div class="flex gap-1.5 justify-center mt-3">
        <div class="w-1.5 h-1.5 rounded-full bg-purple-400/60"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-pink-400/60"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-blue-400/60"></div>
      </div>
    </div>
  </div>
</div>

    <!-- Main Router Outlet -->
    <div class="container mx-auto mb-24 md:mb-28">
      <router-outlet></router-outlet>
      <ng-container *ngIf="!routerOutletHasContent()">
        <div class="alternate-content text-center flex flex-col justify-center min-h-[60vh] items-center px-4">
          <p class="text-lg text-white/80">
            Simplify your group expenses with SplitIt! 📊 Track balances, 💸 manage expenses, and keep everything in
            check.
            Choose an option to get started.🚀
          </p>
        </div>
      </ng-container>
    </div>

    <!-- Bottom Navigation Grid - Matching Style -->
    <div
      class="fixed bottom-4 md:bottom-8 left-1/2 transform -translate-x-1/2 z-20 w-full px-4 md:px-0 md:w-auto max-w-full overflow-x-auto">
      <div
        class="flex flex-nowrap gap-2 justify-center bg-white/5 backdrop-blur-md border border-white/20 rounded-2xl p-2 min-w-min">
        <button [routerLink]="['list-balance']" [queryParams]="{ groupId: groupId }"
          routerLinkActive="bg-white/30 border-white/40 shadow-lg" #rla1="routerLinkActive"
          [class]="rla1.isActive
          ? 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/30 border-white/40 shadow-lg text-xs md:text-sm' 
          : 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/10 border-white/20 hover:bg-white/20 text-xs md:text-sm'">
          <span>Balances</span>
        </button>

        <button [routerLink]="['list-expense']" [queryParams]="{ groupId: groupId }"
          routerLinkActive="bg-white/30 border-white/40 shadow-lg" #rla2="routerLinkActive"
          [class]="rla2.isActive
          ? 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/30 border-white/40 shadow-lg text-xs md:text-sm' 
          : 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/10 border-white/20 hover:bg-white/20 text-xs md:text-sm'">
          <span>Expenses</span>
        </button>

        <button [routerLink]="['add-expense']" [queryParams]="{ groupId: groupId }"
          routerLinkActive="bg-white/30 border-white/40 shadow-lg" #rla3="routerLinkActive"
          [class]="rla3.isActive
          ? 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/30 border-white/40 shadow-lg text-xs md:text-sm' 
          : 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/10 border-white/20 hover:bg-white/20 text-xs md:text-sm'">
          <span>Add Expense</span>
        </button>

        <button [routerLink]="['add-member']" [queryParams]="{ groupId: groupId }"
          routerLinkActive="bg-white/30 border-white/40 shadow-lg" #rla4="routerLinkActive"
          [class]="rla4.isActive
          ? 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/30 border-white/40 shadow-lg text-xs md:text-sm' 
          : 'whitespace-nowrap px-1 sm:px-3 md:px-4 lg:px-6 py-2 md:py-3 backdrop-blur-md border rounded-xl text-white transition-all duration-300 bg-white/10 border-white/20 hover:bg-white/20 text-xs md:text-sm'">
          <span>Add Member</span>
        </button>
      </div>
    </div>
  </div>
</div>
