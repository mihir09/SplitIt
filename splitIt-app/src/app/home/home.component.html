<div class="bg-gray-100 min-h-screen py-10 px-4 flex flex-col items-center space-y-10">

  <!-- Invitations Card -->
  <div *ngIf="invitations.length > 0" class="w-full max-w-xl bg-white rounded-xl shadow-lg p-6 space-y-4">
    <h2 class="text-2xl font-bold text-blue-700 text-center">You've Got Invitations</h2>
    <ul class="space-y-4">
      <li *ngFor="let invitation of invitations" class="border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow transition">
        <p class="text-gray-800 text-base">
          <strong>{{ invitation.senderName }}</strong> invited you to join <span class="font-medium text-blue-600">"{{ invitation.groupName }}"</span>
        </p>
        <div class="flex justify-center mt-3 gap-4">
          <button class="px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white transition"
                  (click)="acceptInvitation(invitation.id)">Accept</button>
          <button class="px-4 py-2 rounded-md bg-red-500 hover:bg-red-600 text-white transition"
                  (click)="declineInvitation(invitation.id)">Decline</button>
        </div>
      </li>
    </ul>
  </div>

  <!-- Groups Card -->
  <div *ngIf="groups.length > 0" class="w-full max-w-xl bg-white rounded-xl shadow-lg p-6 space-y-4">
    <h2 class="text-2xl font-bold text-gray-700 text-center">Your Groups</h2>
    <ul class="space-y-2">
      <li *ngFor="let group of groups" class="text-lg text-gray-700 hover:text-blue-600 transition">
        <a [routerLink]="['/group', group.groupId]" class="block p-2 rounded hover:bg-gray-100">{{ group.groupName }}</a>
      </li>
    </ul>
  </div>

  <!-- Create Group Button -->
  <button class="px-6 py-2 text-white bg-blue-500 rounded-full shadow hover:shadow-md transition"
          (click)="toggleCreateGroup()">
    Create Group
  </button>

  <!-- Modal -->
  <div class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm"
       *ngIf="showCreateGroup">
    <div class="rounded-lg shadow-xl w-full max-w-md relative animate-fadeIn">
      <button class="absolute right-1 text-xl text-red-700 hover:text-red-500 transition"
              (click)="toggleCreateGroup()">×</button>
      <app-create-group></app-create-group>
    </div>
  </div>

</div>
